<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Прогнозы утечек</title>
    <link rel="stylesheet" th:href="@{/styles/predictions.css}">
</head>
<body>
<div class="container">
    <header>
        <h1>Прогнозы утечек</h1>
        <form method="post" th:action="@{/logout}">
            <button class="logout-button" type="submit">Выйти</button>
        </form>
    </header>

    <div id="charts-container"></div>
</div>

<script th:src="@{/scripts/lib/chart.js}"></script>
<script th:src="@{/scripts/lib/luxon.js}"></script>
<script th:src="@{/scripts/lib/chartjs-adapter-luxon.js}"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const predictionsData = JSON.parse(/*[[${predictions}]]*/ '{}');
        const container = document.getElementById('charts-container');

        Object.entries(predictionsData).forEach(([sensorName, data]) => {
            // Создаем контейнер для графика
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-container';

            // Добавляем заголовок
            const title = document.createElement('h2');
            title.textContent = `Датчик: ${sensorName}`;
            chartDiv.appendChild(title);

            // Создаем canvas
            const canvas = document.createElement('canvas');
            chartDiv.appendChild(canvas);
            container.appendChild(chartDiv);

            // Форматируем данные
            const chartData = {
                datasets: [{
                    label: 'Вероятность утечки (%)',
                    data: data.map(item => ({
                        x: item.timestamp,
                        y: item.probability * 100
                    })),
                    borderColor: '#1976d2',
                    tension: 0.1
                }]
            };

            // Конфигурация графика
            new Chart(canvas, {
                type: 'line',
                data: chartData,
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                tooltipFormat: 'dd.MM.yyyy HH:mm'
                            },
                            title: {display: true, text: 'Время'}
                        },
                        y: {
                            min: 0,
                            max: 100,
                            title: {display: true, text: 'Вероятность (%)'}
                        }
                    }
                }
            });
        });
    });
</script>
</body>
</html>
