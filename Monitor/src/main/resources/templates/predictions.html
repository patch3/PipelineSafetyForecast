<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Прогнозы утечек</title>
    <link href="/styles/predictions.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
</head>
<body>
<div class="container">
    <header>
        <h1>Прогнозы утечек</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">Выйти</button>
        </form>
    </header>

    <div id="charts-container"></div>
</div>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const predictionsData = JSON.parse(/*[[${predictions}]]*/ '{}');
        const container = document.getElementById('charts-container');

        Object.entries(predictionsData).forEach(([sensorName, data]) => {
            // Создаем контейнер для графика
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-container';

            // Добавляем заголовок
            const title = document.createElement('h2');
            title.textContent = `Датчик: ${sensorName}`;
            chartDiv.appendChild(title);

            // Создаем canvas
            const canvas = document.createElement('canvas');
            chartDiv.appendChild(canvas);
            container.appendChild(chartDiv);

            // Форматируем данные
            const chartData = {
                datasets: [{
                    label: 'Вероятность утечки (%)',
                    data: data.map(item => ({
                        x: item.timestamp,
                        y: item.probability * 100
                    })),
                    borderColor: '#1976d2',
                    tension: 0.1
                }]
            };

            // Конфигурация графика
            new Chart(canvas, {
                type: 'line',
                data: chartData,
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                tooltipFormat: 'dd.MM.yyyy HH:mm'
                            },
                            title: { display: true, text: 'Время' }
                        },
                        y: {
                            min: 0,
                            max: 100,
                            title: { display: true, text: 'Вероятность (%)' }
                        }
                    }
                }
            });
        });
    });
</script>
</body>
</html>
