<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login</title>
    <link href="/styles/auth.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>Страница входа</h1>
    <form method="POST" th:action="@{/login/processing}">
        <div class="alerts">
            <div class="alert alert-info" role="alert" th:if="${logout}">Вы вышли</div>
            <div class="alert alert-error" role="alert" th:if="${error}">Ошибка входа</div>
            <div class="alert alert-error" role="alert" th:if="${registred}">Вы успешно зарегестрировались</div>
        </div>
        <div>
            <label for="username">Имя:</label>
            <input id="username" name="username" placeholder="Username" required type="text"/>
        </div>
        <div>
            <label for="password">Пароль:</label>
            <input id="password" name="password" placeholder="Password" required type="password"/>
        </div>
        <div>
            <button type="submit">Войти</button>
        </div>
    </form>

    <div class="register-section">
        <p>Еще нет аккаунта?</p>
        <a class="register-button" th:href="@{/registration}">Зарегистрироваться</a>
    </div>
</div>
</body>
</html>
